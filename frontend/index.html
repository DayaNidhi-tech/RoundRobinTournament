                    ROUND ROBIN TOURNAMENT
                </span>

                <h1 id="title">
                    Tournament Dashboard
                </h1>

            </div>


            <div class="topbar-actions">


                <div class="tournament-selector">

                    <span class="selector-label">
                        Tournament
                    </span>

                    <select id="selector">

                </div>


                <div class="profile-button">
