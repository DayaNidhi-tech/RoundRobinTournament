<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Tournament Hub</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <div class="brand auth-brand">
                <div class="brand-mark"><span>TH</span></div>
                <div class="brand-copy"><strong>Tournament</strong><span>Hub</span></div>
            </div>
            <span class="eyebrow">TOURNAMENT MANAGEMENT</span>
            <h1 id="authTitle">Sign in</h1>
            <p id="authDescription">Sign in to access your tournaments.</p>
            <form id="authForm"></form>
            <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>
        </section>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
